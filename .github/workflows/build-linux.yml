name: Build Linux

on:
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg libfuse2

      # Native Holepunch addons (sodium-native, udx-native, …) must be
      # compiled on Linux; a Windows-built tree will not run.
      # npm install (pas ci) car le lockfile est régénéré après mise à jour des deps.
      - run: npm install

      - run: npm run build:icons
      - run: npm run build

      - run: npx electron-builder --linux --${{ matrix.arch }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: asgard-linux-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.pacman
            release/*.tar.gz
          if-no-files-found: error

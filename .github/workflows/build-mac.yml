name: Build macOS

# Lancement manuel depuis l'onglet Actions du dépôt.
on:
  workflow_dispatch:

jobs:
  mac:
    strategy:
      # On veut voir les deux architectures aboutir ou échouer indépendamment.
      fail-fast: false
      matrix:
        include:
          # macos-13 (Intel) a été retiré le 04/12/2025 ; macos-15-intel est la
          # dernière image x86_64 proposée par GitHub, jusqu'en août 2027.
          - runner: macos-15-intel
            arch: x64
          - runner: macos-14   # Apple Silicon
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install recompile les modules natifs Holepunch (sodium-native, udx-native)
      # pour darwin, ce qui n'est possible que sur un runner macOS.
      # (udx-native : transport d'hyperswarm 4 / hyperdht 6 — utp-native n'existe
      # plus dans la stack et n'est pas installé.)
      # npm install (pas ci) car le lockfile est régénéré après mise à jour des deps.
      - run: npm install

      # assets/icon.icns est gitignoré : il doit être régénéré ici.
      - run: npm run build:icons

      - run: npm run build

      # Pas de certificat Apple : on désactive la recherche d'identité de
      # signature, sinon electron-builder échoue au lieu de produire un binaire.
      # --publish never : sans cela, electron-builder tente de créer une release
      # GitHub après le build et échoue faute de GH_TOKEN.
      - run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Contrôle des émojis, fait ICI et pas sur le poste de développement : macOS
      # n'a pas le défaut de Linux (Apple Color Emoji est installée sur toute la
      # plateforme, aucun repli n'est nécessaire pour l'interface), mais c'est
      # aussi la seule des trois cibles où personne ne peut lancer le paquet avant
      # toi. Le verrou source prouve qu'aucun émoji n'est revenu comme icône et
      # que chaque émoji de contenu est couvert par le sous-ensemble embarqué ; le
      # contrôle du paquet prouve que la police et son @font-face voyagent bien
      # dans l'asar mac, comme elles le font sous Windows et Linux.
      - name: Contrôler icônes et police émoji dans le paquet
        run: |
          set -euo pipefail
          node scripts/check-no-emoji-icons.mjs
          asar="$(find release -maxdepth 6 -name app.asar -path '*Asgard.app/*' | head -1)"
          if [ -z "$asar" ]; then echo "app.asar introuvable sous release/"; ls -lR release; exit 1; fi
          echo "contrôle de $asar"
          node scripts/verify-build-labels.mjs --asar "$asar"

      - uses: actions/upload-artifact@v4
        with:
          name: asgard-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
